# Cache-Control policy.
#
# No [build] section on purpose — build command and publish dir stay in the
# Netlify UI. Adding them here would silently override those settings.
#
# Netlify's baseline for every file is
#
#     public, max-age=0, must-revalidate
#
# plus an ETag, with the CDN cache purged on every deploy. That default is
# already correct for HTML, so this file lists ONLY the paths that need to
# deviate from it.
#
# Rule of thumb used below:
#   filename contains a content hash  -> immutable, cache for a year
#   filename is stable across edits   -> short cache, revalidate
#
# Overlaps: a matching rule REPLACES Cache-Control outright — it never merges
# with another rule. Verified in production: one header per response, no
# duplicated directives. Where two rules could both match, the narrower one
# won, but that is indistinguishable from "the later one won" while this file
# stays ordered broad to narrow. Keep it ordered that way, and note that a
# narrower glob does beat a broader glob (/*.xml beat a former /* rule).
#
# The deploy purge clears Netlify's edge, never a browser. Every max-age below
# is a promise you cannot take back for that long.

# ---------------------------------------------------------------------------
# Astro build output — all content-hashed by the build
# (style.CjbzqE0a.css, 1984.BB0ymils_1ezRW8.avif, fonts/1nJ0mBUE.woff2, ...).
#
# Fonts are in here too, under /_astro/fonts/. Astro hashes them by file
# CONTENT, so re-subsetting the woff2 in place ships a new URL on its own —
# no filename discipline to remember, unlike the public/fonts/ setup this
# replaced.
#
# The hash changes whenever the content does, so a given URL can never point at
# different bytes. immutable is honest here, and this is the biggest win:
# CSS and images drop to ZERO requests on repeat visits.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# /pagefind/* has NO rule here, deliberately — it must stay on Netlify's
# max-age=0 default.
#
# pagefind-entry.json is an unhashed manifest, rewritten on every build, that
# points at the current index bundle ("hash":"en_<changes every build>"). If a
# stale copy is cached, search asks for chunks that no longer exist and breaks
# — silently, inside a web worker. Same for pagefind.js / pagefind-ui.* /
# wasm.*, whose names are stable across versions.
#
# So if you ever add a broad rule that would hand /pagefind/* a nonzero
# max-age, add a /pagefind/* override alongside it that restores
# "public, max-age=0, must-revalidate".
#
# Tempting follow-up, deliberately NOT done: the chunks under index/ and
# fragment/ (en_78b5f6f.pf_index) look content-hashed and could be immutable.
# Unverified whether those names are true content hashes — if they are not,
# search breaks silently for up to a year. Settle it on a branch deploy first.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Unhashed static files in public/ — edited in place under a stable name,
# so no immutable. A week of caching; a replacement self-heals within a week
# rather than within a year.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/images/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"

  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------------------------------------------------------------------------
# Feeds — readers poll these. An hour of caching, then revalidate.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*.xml"

  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
